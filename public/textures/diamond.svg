<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- LB-004: Diamond gem у Minecraft-esque pixel-art стилі.
       Замінює diamond_ore.png (яка була ORE, а не сама gem).
       16x16 grid, pixelated rendering — гармонує з іншими 16x16 texture'ами. -->

  <!-- Основне тіло — світло-блакитний "diamond" core -->
  <!-- Верхня половина -->
  <rect x="7" y="1" width="2" height="1" fill="#7ec7e8"/>
  <rect x="5" y="2" width="6" height="1" fill="#7ec7e8"/>
  <rect x="3" y="3" width="10" height="1" fill="#7ec7e8"/>
  <rect x="2" y="4" width="12" height="1" fill="#5eb0d8"/>
  <rect x="1" y="5" width="14" height="1" fill="#5eb0d8"/>
  <rect x="1" y="6" width="14" height="1" fill="#4a9dc7"/>
  <rect x="1" y="7" width="14" height="1" fill="#4a9dc7"/>

  <!-- Нижня половина — темніше (fade у shadow) -->
  <rect x="1" y="8" width="14" height="1" fill="#3d8fbb"/>
  <rect x="2" y="9" width="12" height="1" fill="#3487b3"/>
  <rect x="3" y="10" width="10" height="1" fill="#2c7ba5"/>
  <rect x="4" y="11" width="8" height="1" fill="#256d94"/>
  <rect x="5" y="12" width="6" height="1" fill="#256d94"/>
  <rect x="6" y="13" width="4" height="1" fill="#1e6083"/>
  <rect x="7" y="14" width="2" height="1" fill="#1e6083"/>

  <!-- Highlight facets — світлі відблиски щоб виглядало огранено -->
  <rect x="6" y="3" width="1" height="1" fill="#c8e8f4"/>
  <rect x="4" y="4" width="1" height="1" fill="#c8e8f4"/>
  <rect x="5" y="4" width="1" height="1" fill="#a9dff5"/>
  <rect x="3" y="5" width="1" height="1" fill="#a9dff5"/>
  <rect x="4" y="5" width="1" height="1" fill="#c8e8f4"/>
  <rect x="2" y="6" width="2" height="1" fill="#a9dff5"/>

  <!-- Central bright spot — sparkle -->
  <rect x="7" y="4" width="1" height="1" fill="#ffffff"/>
  <rect x="8" y="4" width="1" height="1" fill="#e6f7ff"/>

  <!-- Right-side depth -->
  <rect x="12" y="6" width="2" height="1" fill="#3d8fbb"/>
  <rect x="13" y="7" width="1" height="1" fill="#3d8fbb"/>

  <!-- Bottom-left deepest shadow -->
  <rect x="4" y="10" width="1" height="1" fill="#1e6083"/>
  <rect x="5" y="11" width="1" height="1" fill="#1e6083"/>
</svg>
